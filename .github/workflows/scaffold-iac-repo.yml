name: 'Scaffold IaC Repository'

# Triggered manually from the GitHub Actions UI.
# Requires a PAT stored as SCAFFOLD_GITHUB_TOKEN with:
#   - repo scope (to create repos and push code)
#   - Or a GitHub App token with contents:write and administration:write on the org.
#
# For Azure repos, the optional bootstrap job also needs these secrets configured
# on THIS (iac-shared-workflows) repo, plus a bootstrap app registration whose
# federated credential trusts subject
# 'repo:<owner>/iac-shared-workflows:ref:refs/heads/main':
#   - AZURE_BOOTSTRAP_CLIENT_ID : client ID of the bootstrap app used to log in here
#   - AZURE_TENANT_ID           : Entra tenant ID
#   - AZURE_SUBSCRIPTION_ID      : target subscription ID
# The bootstrap identity needs rights to manage the target app's federated
# credentials (e.g. Application Administrator) and to assign RBAC on the
# subscription (e.g. Owner / User Access Administrator).
#
# The Azure app registration (client) ID used by scaffolded repos defaults to
# the repo/org variable 'AZURE_APP_CLIENT_ID'; set it once to avoid entering it
# on every run. The 'azure_app_client_id' input is an optional per-run override.

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Base name of the new IaC repo (auto-prefixed with the cloud provider, e.g. "networking" -> "azure-networking")'
        required: true
        type: string
      cloud_provider:
        description: 'Cloud provider for the IaC repo'
        required: true
        type: choice
        options:
          - aws
          - azure
      azure_app_client_id:
        description: 'Azure app registration (client) ID for OIDC — optional; defaults to the AZURE_APP_CLIENT_ID variable'
        required: false
        type: string
        default: ''
      workspace_name:
        description: 'Name of the initial Terraform workspace (created at iac/ws-<name>)'
        required: true
        type: string
      description:
        description: 'Repository description (optional)'
        required: false
        type: string
        default: ''
      visibility:
        description: 'Repository visibility'
        required: false
        type: choice
        options:
          - private
          - internal
          - public
        default: private

jobs:
  scaffold:
    name: 'Scaffold ${{ inputs.cloud_provider }} repo: ${{ inputs.cloud_provider }}-${{ inputs.repo_name }}'
    runs-on: ubuntu-latest
    env:
      # Scaffolded repos are prefixed with the cloud provider (e.g. azure-networking).
      REPO_NAME: ${{ inputs.cloud_provider }}-${{ inputs.repo_name }}

    steps:
      - name: Checkout shared workflows repo
        uses: actions/checkout@v4

      - name: Check repository does not already exist
        env:
          GH_TOKEN: ${{ secrets.SCAFFOLD_GITHUB_TOKEN }}
        run: |
          if gh repo view ${{ github.repository_owner }}/${REPO_NAME} &>/dev/null; then
            echo "Error: Repository '${{ github.repository_owner }}/${REPO_NAME}' already exists."
            exit 1
          fi

      - name: Create GitHub Repository
        env:
          GH_TOKEN: ${{ secrets.SCAFFOLD_GITHUB_TOKEN }}
        run: |
          gh repo create ${{ github.repository_owner }}/${REPO_NAME} \
            --${{ inputs.visibility }} \
            --description "${{ inputs.description }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Copier
        run: pipx install copier

      - name: Render scaffold with Copier
        run: |
          ROOT=scaffold-workspace

          # Render the full repo (docs/, iac/ws-<name>/ Terraform files, and
          # the provider-specific pipeline) from the Copier template.
          # --defaults keeps it non-interactive; all answers are passed via --data.
          copier copy --defaults \
            --data repo_name="${REPO_NAME}" \
            --data cloud_provider="${{ inputs.cloud_provider }}" \
            --data workspace_name="${{ inputs.workspace_name }}" \
            --data description="${{ inputs.description }}" \
            ./scaffolding/copier-template "$ROOT"

      - name: Commit and push scaffold
        env:
          GH_TOKEN: ${{ secrets.SCAFFOLD_GITHUB_TOKEN }}
        run: |
          ROOT=scaffold-workspace

          # --- Commit and push ---
          cd "$ROOT"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/${REPO_NAME}.git
          git add .
          git commit -m "chore: scaffold ${{ inputs.cloud_provider }} Terraform IaC repo"
          git branch -M main
          git push -u origin main

  azure_bootstrap:
    name: 'Bootstrap Azure OIDC for ${{ inputs.cloud_provider }}-${{ inputs.repo_name }}'
    needs: scaffold
    if: inputs.cloud_provider == 'azure'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Scaffolded repos are prefixed with the cloud provider (e.g. azure-networking).
      REPO_NAME: ${{ inputs.cloud_provider }}-${{ inputs.repo_name }}
      # Use the per-run input if given, otherwise fall back to the repo/org variable.
      APP_ID: ${{ inputs.azure_app_client_id != '' && inputs.azure_app_client_id || vars.AZURE_APP_CLIENT_ID }}
      # IDs aren't sensitive, so accept them as either Actions secrets or variables.
      BOOTSTRAP_CLIENT_ID: ${{ secrets.AZURE_BOOTSTRAP_CLIENT_ID || vars.AZURE_BOOTSTRAP_CLIENT_ID }}
      TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Validate Azure inputs
        run: |
          echo "input given?   ${{ inputs.azure_app_client_id != '' }}"
          echo "vars set?      ${{ vars.AZURE_APP_CLIENT_ID != '' }}"
          echo "APP_ID length: ${#APP_ID}"
          if [ -z "${APP_ID}" ]; then
            echo "Error: no Azure app client ID. Provide the 'azure_app_client_id' input or set the AZURE_APP_CLIENT_ID Actions *variable* (Variables tab, not Secrets)."
            exit 1
          fi
          missing=0
          for name in BOOTSTRAP_CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "Error: AZURE_${name} is not set as a repo/org secret or variable accessible to ${{ github.repository }}."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Register federated credentials
        env:
          ORG: ${{ github.repository_owner }}
          REPO: ${{ env.REPO_NAME }}
        run: |
          # One federated credential per GitHub environment used by the pipeline.
          for env_name in staging-azure production-azure; do
            az ad app federated-credential create --id "$APP_ID" --parameters "{
              \"name\": \"gh-${REPO}-${env_name}\",
              \"issuer\": \"https://token.actions.githubusercontent.com\",
              \"subject\": \"repo:${ORG}/${REPO}:environment:${env_name}\",
              \"audiences\": [\"api://AzureADTokenExchange\"]
            }"
          done

      - name: Assign Contributor role to the service principal
        run: |
          OBJECT_ID=$(az ad sp show --id "$APP_ID" --query id -o tsv)
          az role assignment create \
            --assignee-object-id "$OBJECT_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "Contributor" \
            --scope "/subscriptions/${SUBSCRIPTION_ID}"

      - name: Configure GitHub environments and secrets
        env:
          GH_TOKEN: ${{ secrets.SCAFFOLD_GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
          REPO: ${{ env.REPO_NAME }}
        run: |
          for env_name in staging-azure production-azure; do
            gh api -X PUT "repos/${ORG}/${REPO}/environments/${env_name}" >/dev/null
          done
          gh secret set AZURE_CLIENT_ID       -R "${ORG}/${REPO}" -b "$APP_ID"
          gh secret set AZURE_TENANT_ID       -R "${ORG}/${REPO}" -b "$TENANT_ID"
          gh secret set AZURE_SUBSCRIPTION_ID -R "${ORG}/${REPO}" -b "$SUBSCRIPTION_ID"
