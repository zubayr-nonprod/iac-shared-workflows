name: 'Terraform AWS Template'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (e.g. staging-aws, production-aws)'
        required: true
        type: string
      is_apply:
        description: 'Run terraform apply (true) or plan only (false)'
        required: true
        type: boolean
      working_directory:
        description: 'Directory containing Terraform configuration'
        required: false
        type: string
        default: '.'
      aws_region:
        description: 'AWS region to deploy to'
        required: false
        type: string
        default: 'us-east-1'
      tf_version:
        description: 'Terraform version to use'
        required: false
        type: string
        default: 'latest'
    secrets:
      AWS_ROLE_ARN:
        description: 'AWS IAM Role ARN for OIDC authentication'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  terraform-aws:
    name: 'Terraform AWS (${{ inputs.environment }})'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.tf_version }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: inputs.is_apply == true
        run: terraform apply -auto-approve tfplan
