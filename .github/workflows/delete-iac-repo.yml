name: 'Delete IaC Repository'

# Triggered manually. Tears down a repo created by 'Scaffold IaC Repository' so the
# same name can be reused while developing/testing the scaffold workflow.
#
# Removes:
#   - The repo's deploy identity 'id-gh-<repo>' (and with it its federated credentials)
#     plus its role assignments in every subscription the bootstrap identity can see.
#   - Legacy federated credentials on the shared app (AZURE_APP_CLIENT_ID) for repos
#     scaffolded before per-repo identities.
#   - The GitHub repository itself (its environments and variables go with it).
#
# Deliberately NOT removed:
#   - Any cloud resources the repo's pipeline deployed, or its Terraform state blobs.
#     Run 'terraform destroy' first if needed.
#
# Requires:
#   - SCAFFOLD_GITHUB_TOKEN with Administration: read & write (or classic 'delete_repo' scope).
#   - The same 'production' environment variables as the scaffold workflow's Azure jobs.

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Full name of the repo to delete, including cloud prefix (e.g. "azure-networking")'
        required: true
        type: string
      confirm:
        description: 'Type the repo name again to confirm deletion'
        required: true
        type: string

jobs:
  validate:
    name: 'Validate ${{ inputs.repo_name }}'
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    env:
      REPO_NAME: ${{ inputs.repo_name }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Validate inputs
        run: |
          if [ "$REPO_NAME" != "$CONFIRM" ]; then
            echo "Error: confirmation '$CONFIRM' does not match repo name '$REPO_NAME'."
            exit 1
          fi
          if ! [[ "$REPO_NAME" =~ ^(aws|azure)-[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "Error: only scaffolded repos named 'aws-<name>' or 'azure-<name>' can be deleted."
            exit 1
          fi

      - name: Check repository exists and was scaffolded
        id: check
        env:
          GH_TOKEN: ${{ secrets.SCAFFOLD_GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          if ! out=$(gh api "repos/${ORG}/${REPO_NAME}" --silent 2>&1); then
            if grep -q 'HTTP 404' <<<"$out"; then
              echo "Repository ${ORG}/${REPO_NAME} not found; will only clean up Azure references."
              echo "exists=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Error checking repository: $out"
            exit 1
          fi
          # Guard against deleting repos that weren't created from the Copier template.
          # Empty repos are allowed: the scaffold creates the repo before the Azure bootstrap and push.
          if ! gh api "repos/${ORG}/${REPO_NAME}/contents/.copier-answers.yml" --silent 2>/dev/null; then
            if gh api "repos/${ORG}/${REPO_NAME}/commits?per_page=1" --silent 2>&1 | grep -q 'HTTP 409'; then
              echo "${ORG}/${REPO_NAME} is empty (scaffold didn't finish); OK to delete."
            else
              echo "Error: ${ORG}/${REPO_NAME} has no .copier-answers.yml; refusing to delete a non-scaffolded repo."
              exit 1
            fi
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"

  azure_cleanup:
    name: 'Remove Azure identity and access for ${{ inputs.repo_name }}'
    needs: validate
    if: startsWith(inputs.repo_name, 'azure-')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      REPO_NAME: ${{ inputs.repo_name }}
      IDENTITY_NAME: id-gh-${{ inputs.repo_name }}
      IDENTITY_SUBSCRIPTION_ID: ${{ vars.AZURE_IDENTITY_SUBSCRIPTION_ID }}
      IDENTITY_RESOURCE_GROUP: ${{ vars.AZURE_IDENTITY_RESOURCE_GROUP }}
      LEGACY_APP_ID: ${{ vars.AZURE_APP_CLIENT_ID }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID || secrets.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Delete deploy identity and its role assignments
        run: |
          principal_id=$(az identity show -n "$IDENTITY_NAME" -g "$IDENTITY_RESOURCE_GROUP" \
            --subscription "$IDENTITY_SUBSCRIPTION_ID" --query principalId -o tsv 2>/dev/null || true)
          if [ -z "$principal_id" ]; then
            echo "No deploy identity '$IDENTITY_NAME' found."
            exit 0
          fi

          # Remove assignments before the identity, otherwise they're left behind as 'Unknown' principals.
          for sub in $(az account list --query "[?state=='Enabled'].id" -o tsv); do
            ids=$(az role assignment list --all --subscription "$sub" --query "[?principalId=='$principal_id'].id" -o tsv)
            for id in $ids; do
              echo "Deleting role assignment $id"
              az role assignment delete --ids "$id"
            done
          done

          echo "Deleting identity $IDENTITY_NAME"
          az identity delete -n "$IDENTITY_NAME" -g "$IDENTITY_RESOURCE_GROUP" --subscription "$IDENTITY_SUBSCRIPTION_ID"

      - name: Delete legacy federated credentials on the shared app
        if: env.LEGACY_APP_ID != ''
        env:
          ORG: ${{ github.repository_owner }}
        run: |
          # Matches both 'repo:<org>/<repo>:' and immutable 'repo:<org>@<id>/<repo>@<id>:' subjects.
          pattern="^repo:${ORG}(@[0-9]+)?/${REPO_NAME}(@[0-9]+)?:"
          ids=$(az ad app federated-credential list --id "$LEGACY_APP_ID" --query '[].[id, subject]' -o tsv \
            | awk -F'\t' -v p="$pattern" '$2 ~ p { print $1 }')
          if [ -z "$ids" ]; then
            echo "No legacy federated credentials reference ${ORG}/${REPO_NAME}."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting legacy federated credential $id"
            az ad app federated-credential delete --id "$LEGACY_APP_ID" --federated-credential-id "$id"
          done

  delete_repo:
    name: 'Delete repo ${{ inputs.repo_name }}'
    needs: [validate, azure_cleanup]
    # Run even when azure_cleanup is skipped (aws-* repos), but not if it failed.
    if: always() && needs.validate.result == 'success' && needs.validate.outputs.exists == 'true' && needs.azure_cleanup.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Delete GitHub repository
        env:
          GH_TOKEN: ${{ secrets.SCAFFOLD_GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
          REPO_NAME: ${{ inputs.repo_name }}
        run: gh repo delete "${ORG}/${REPO_NAME}" --yes
