name: 'Terraform Azure Template'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (e.g. staging-azure, production-azure)'
        required: true
        type: string
      is_apply:
        description: 'Run terraform apply (true) or plan only (false)'
        required: true
        type: boolean
      working_directory:
        description: 'Directory containing Terraform configuration'
        required: false
        type: string
        default: '.'
      tf_version:
        description: 'Terraform version to use'
        required: false
        type: string
        default: 'latest'
    # Prefer the AZURE_* Actions variables; these secrets are a fallback for repos scaffolded before the switch.
    secrets:
      AZURE_CLIENT_ID:
        description: 'Azure AD App Client ID for OIDC authentication (deprecated: use the AZURE_CLIENT_ID variable)'
        required: false
      AZURE_TENANT_ID:
        description: 'Azure AD Tenant ID (deprecated: use the AZURE_TENANT_ID variable)'
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: 'Azure Subscription ID (deprecated: use the AZURE_SUBSCRIPTION_ID variable)'
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform-azure:
    name: 'Terraform Azure (${{ inputs.environment }})'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      # Fail on missing variables instead of hanging on an interactive prompt.
      TF_INPUT: false
      TF_IN_AUTOMATION: true
      TF_VAR_environment: ${{ inputs.environment }}
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      TF_STATE_SUBSCRIPTION_ID: ${{ vars.TF_STATE_SUBSCRIPTION_ID }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.tf_version }}

      - name: Terraform Init
        run: |
          missing=0
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID TF_STATE_STORAGE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "Error: $name is empty; set the AZURE_* repo variables and TF_STATE_* org variables."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Deploying to subscription ${ARM_SUBSCRIPTION_ID} (tenant ${ARM_TENANT_ID}) as client ${ARM_CLIENT_ID}"
          if ! grep -qs 'backend "azurerm"' *.tf; then
            echo "Error: no 'backend \"azurerm\" {}' block in ${{ inputs.working_directory }}; refusing to use local state."
            exit 1
          fi
          # Staging/production are approval gates over the same deployment, so one state per workspace.
          terraform init \
            -backend-config="subscription_id=${TF_STATE_SUBSCRIPTION_ID}" \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${{ github.event.repository.name }}/${{ inputs.working_directory }}.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: inputs.is_apply == true
        run: terraform apply -auto-approve tfplan
